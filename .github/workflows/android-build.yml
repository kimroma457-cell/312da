name: Android Build Verification

on:
  push:
    branches:
      - claude/mobile-pdf-hwp-support-t5ozbc
    paths:
      - 'mobile-viewer/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  assembleDebug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager --install "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Sync check (help task forces configuration phase)
        run: ./gradlew help --stacktrace --no-daemon

      - name: Resolve androidx.pdf dependency
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon | grep -A2 -i "androidx.pdf" || true

      - name: assembleDebug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile-viewer/app/build/outputs/apk/debug/*.apk
